services:
  - type: web
    name: tripwindow-api
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: tripwindow-db
          property: connectionString

databases:
  - name: tripwindow-db
    plan: free
